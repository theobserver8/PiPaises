<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Repaso Pi Países</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f0f0f0" id="theme-color-meta">
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333333;
            --card-bg: #ffffff;
            --card-shadow: rgba(0, 0, 0, 0.1);
            --accent: #007bff;
            --btn-bg: #e0e0e0;
            --btn-text: #333;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --card-shadow: rgba(0, 0, 0, 0.5);
            --accent: #4da3ff;
            --btn-bg: #333333;
            --btn-text: #e0e0e0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Nueva estructura de la cabecera en 3 columnas */
        .header {
            padding: 10px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            box-shadow: 0 2px 5px var(--card-shadow);
            z-index: 20;
            width: 100%;
        }

        /* Los bloques laterales ocupan el mismo espacio (flex: 1) para que el centro sea exacto */
        .header-left {
            display: flex;
            gap: 6px;
            align-items: center;
            flex: 1;
            justify-content: flex-start;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            flex: 1;
            justify-content: flex-end;
        }

        /* Estilos generales de botones adaptados para móviles */
        .header button {
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .header-center button {
            background: var(--btn-bg);
            color: var(--btn-text);
            min-width: 40px;
        }

        .header-center input {
            width: 50px;
            padding: 7px 2px;
            text-align: center;
            border-radius: 5px;
            border: 1px solid var(--btn-bg);
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: bold;
            font-size: 14px;
        }

        .config-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border-radius: 20px !important;
        }

        .theme-toggle {
            background: var(--accent) !important;
            color: white !important;
            border-radius: 20px !important;
        }

        .reset-btn {
            background: #ff4d4d !important;
            /* Rojo suave para indicar peligro/reinicio */
            color: white !important;
            border-radius: 20px !important;
        }

        /* Contenedor de Tarjetas */
        .cards-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 10px 0;
        }

        .card {
            position: absolute;
            width: 85%;
            max-width: 350px;
            height: 240px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 20px var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .card .index {
            font-size: 1.1rem;
            color: #888;
            font-weight: bold;
            margin: 0;
        }

        .card .country {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.1;
            margin: 0;
            font-size: 1.8rem;
        }

        .card .pi-digits {
            font-size: 3rem;
            font-family: "SF Mono", "Roboto Mono", Consolas, Monaco, monospace;
            font-weight: bold;
            letter-spacing: 4px;
            margin: 0;
            color: var(--text-color);
        }

        /* Posicionamiento ajustado */
        .card.prev {
            top: 10%;
            transform: translateY(0) scale(0.75);
            opacity: 0.25;
            z-index: 1;
        }

        .card.current {
            top: 50%;
            transform: translateY(-50%) scale(1);
            opacity: 1;
            z-index: 2;
        }

        .card.next {
            top: 90%;
            transform: translateY(-100%) scale(0.75);
            opacity: 0.25;
            z-index: 1;
        }

        .card.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Zonas táctiles tipo Kindle */
        .touch-zone {
            position: absolute;
            top: 70px;
            bottom: 0;
            width: 40%;
            z-index: 15;
        }

        .touch-left {
            left: 0;
        }

        .touch-right {
            right: 0;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-left">
            <button id="theme-btn" class="theme-toggle" onclick="toggleTheme()">🌙</button>
            <button id="step-btn" class="config-btn" onclick="toggleStepSize()">🔢 10</button>
        </div>

        <div class="header-center">
            <button id="btn-leap-back" onclick="move(-currentStep)">-10</button>
            <input type="number" id="jump-input" min="1" max="253" onchange="jumpTo(this.value)">
            <button id="btn-leap-forward" onclick="move(currentStep)">+10</button>
        </div>

        <div class="header-right">
            <button class="reset-btn" onclick="confirmReset()">🔄</button>
        </div>
    </header>

    <div class="touch-zone touch-left" onclick="move(-1)"></div>
    <div class="touch-zone touch-right" onclick="move(1)"></div>

    <main class="cards-container">
        <div id="card-prev" class="card prev">
            <div class="index" id="prev-index"></div>
            <div class="country" id="prev-country"></div>
            <div class="pi-digits" id="prev-digits"></div>
        </div>

        <div id="card-current" class="card current">
            <div class="index" id="current-index"></div>
            <div class="country" id="current-country"></div>
            <div class="pi-digits" id="current-digits"></div>
        </div>

        <div id="card-next" class="card next">
            <div class="index" id="next-index"></div>
            <div class="country" id="next-country"></div>
            <div class="pi-digits" id="next-digits"></div>
        </div>
    </main>

    <script>
        // Datos extraídos del listado original

AO (PB)|82796,208,ARUBA (PB)|82303,209,JERSEY (UK)|01952,210,ISLAS VÍRGENES DE LOS EE.UU.|03530,211,ISLA DE MAN (UK)|18529,212,ISLAS CAIMÁN (UK)|68995,213,GUERNSEY (UK)|77362,214,BERMUDAS (UK)|25994,215,GROENLANDIA (DK)|13891,216,OSETIA DEL SUR|24972,217,ISLAS FEROE (DK)|17752,218,SAMOA AMERICANA (EEUU)|83479,219,ISLAS MARIANAS DEL NORTE (EEUU)|13151,220,ISLAS TURCAS Y CAICOS (UK)|55748,221,SINT MAARTEN (PB)|57242,222,GIBRALTAR (UK)|45415,223,SAN MARTÍN (FR)|06959,224,ISLAS VÍRGENES BRITÁNICAS (UK)|50829,225,ALAND (FI)|53311,226,ANGUILA (UK)|68617,227,ISLAS COOK|27855,228,WALLIS Y FUTUNA (FR)|88907,229,SAN BARTOLOMÉ (FR)|50983,230,SAN PEDRO Y MIQUELÓN (FR)|81754,231,SANTA ELENA|63746,232,ISLA DE LA ASCENSIÓN|49393,233,TRISTÁN DE ACUÑA|19255,234,MONTSERRAT (UK)|06040,235,ISLAS MALVINAS (UK)|09277,236,ISLA NORFOLK (AU)|01671,237,ISLA DE NAVIDAD (AU)|13900,238,NIUE (NZ)|98488,239,TOKELAU (NZ)|24012,240,ISLAS COCOS (KEELING) (AU)|85836,241,ISLAS PITCAIRN (UK)|16035,242,SOMALILANDIA|63707,243,BONAIRE (NL)|66010,244,SINT EUSTATIUS (NL)|47101,245,SABA (NL)|81942,246,REUNIÓN (FR)|95559,247,GUADALUPE (FR)|61989,248,MARTINICA (FR)|46767,249,MAYOTTE (FR)|83744,250,GUAYANA FRANCESA (FR)|94482,251,ISLAS GEORGIAS DEL SUR Y SANDWICH DEL SUR (UK)|55379,252,ISLA DE PASCUA (CL)|77472,253,TERRITORIO BRITÁNICO DEL OCÉANO ÍNDICO (UK)`;

        const list = rawData.split('|').map(item => {
            const [digits, index, country] = item.split(',');
            return { digits, index: parseInt(index), country };
        });

        let currentIndex = parseInt(localStorage.getItem('pi_last_index')) || 0;
        let currentStep = parseInt(localStorage.getItem('pi_step_size')) || 10;

        function updateUI() {
            localStorage.setItem('pi_last_index', currentIndex);
            document.getElementById('jump-input').value = list[currentIndex].index;

            populateCard('current', list[currentIndex]);

            if (currentIndex > 0) {
                document.getElementById('card-prev').classList.remove('hidden');
                populateCard('prev', list[currentIndex - 1]);
            } else {
                document.getElementById('card-prev').classList.add('hidden');
            }

            if (currentIndex < list.length - 1) {
                document.getElementById('card-next').classList.remove('hidden');
                populateCard('next', list[currentIndex + 1]);
            } else {
                document.getElementById('card-next').classList.add('hidden');
            }
        }

        function populateCard(prefix, data) {
            document.getElementById(`${prefix}-index`).innerText = `#${data.index}`;

            const countryEl = document.getElementById(`${prefix}-country`);
            countryEl.innerText = data.country;

            const len = data.country.length;
            if (len > 35) {
                countryEl.style.fontSize = '1.1rem';
            } else if (len > 22) {
                countryEl.style.fontSize = '1.4rem';
            } else {
                countryEl.style.fontSize = '1.8rem';
            }

            document.getElementById(`${prefix}-digits`).innerText = data.digits;
        }

        function move(step) {
            currentIndex += step;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= list.length) currentIndex = list.length - 1;
            updateUI();
        }

        function jumpTo(val) {
            let target = parseInt(val) - 1;
            if (isNaN(target)) return;
            if (target < 0) target = 0;
            if (target >= list.length) target = list.length - 1;
            currentIndex = target;
            updateUI();
        }

        // Nueva función con confirmación para el Reset
        function confirmReset() {
            if (confirm("¿Estás seguro de que quieres volver a la primera tarjeta?")) {
                jumpTo(1);
            }
        }

        function toggleStepSize() {
            currentStep = (currentStep === 10) ? 5 : 10;
            localStorage.setItem('pi_step_size', currentStep);
            updateStepUI();
        }

        function updateStepUI() {
            document.getElementById('step-btn').innerText = `🔢 ${currentStep}`;
            document.getElementById('btn-leap-back').innerText = `-${currentStep}`;
            document.getElementById('btn-leap-forward').innerText = `+${currentStep}`;
        }

        function toggleTheme() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');

            // Usamos iconos más limpios para ahorrar espacio en móviles
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
            document.getElementById('theme-color-meta').setAttribute('content', isDark ? '#121212' : '#f0f0f0');
            localStorage.setItem('pi_theme', isDark ? 'dark' : 'light');
        }

        function applySavedTheme() {
            const savedTheme = localStorage.getItem('pi_theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);

            if (isDark) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-color-meta').setAttribute('content', '#121212');
            }

            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
        }

        window.onload = () => {
            applySavedTheme();
            updateStepUI();
            updateUI();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(() => { });
            }
        };
    </script>
</body>

</html>
